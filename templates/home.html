<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心晴 · 大学生心理健康平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a9e7e;
    --sage-light: #b8d4bb;
    --sage-dark: #4a6b4e;
    --cream: #f8f4ee;
    --warm-white: #fdfaf6;
    --moss: #3d5c40;
    --terracotta: #c17f5a;
    --terracotta-light: #e8c4a8;
    --sky: #8ab8c8;
    --gold: #c9a96e;
    --text-dark: #2c3e2d;
    --text-mid: #5a6b5c;
    --text-light: #8a9b8c;
    --glass: rgba(255,255,255,0.65);
    --glass-border: rgba(255,255,255,0.8);
    --shadow: 0 8px 40px rgba(61,92,64,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    background-color: #e8f0e4;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(122,158,126,0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(138,184,200,0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 30%, rgba(193,127,90,0.1) 0%, transparent 40%);
    overflow-x: hidden;
  }

  /* floating botanical decorations */
  .bg-deco {
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }
  .leaf-1 {
    top: -40px; right: 8%;
    width: 220px; opacity: 0.18;
    animation: sway 8s ease-in-out infinite;
  }
  .leaf-2 {
    bottom: 5%; left: -30px;
    width: 180px; opacity: 0.14;
    animation: sway 10s ease-in-out infinite reverse;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-10px); }
  }

  /* nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px;
    background: rgba(248,244,238,0.75);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(122,158,126,0.2);
  }
  .nav-logo {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 1.5rem;
    color: var(--moss);
    letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-logo svg { width: 28px; height: 28px; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    text-decoration: none;
    font-size: 0.9rem;
    color: var(--text-mid);
    font-weight: 400;
    letter-spacing: 0.03em;
    transition: color 0.2s;
    position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -3px; left: 0; right: 0;
    height: 1.5px; background: var(--sage);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s;
  }
  .nav-links a:hover { color: var(--moss); }
  .nav-links a:hover::after { transform: scaleX(1); }

  /* hero */
  .hero {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 120px 24px 80px;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(122,158,126,0.15);
    border: 1px solid rgba(122,158,126,0.35);
    border-radius: 50px;
    padding: 7px 18px;
    font-size: 0.82rem;
    color: var(--sage-dark);
    letter-spacing: 0.08em;
    margin-bottom: 32px;
    animation: fadeUp 0.8s ease both;
  }
  .hero-badge .dot {
    width: 6px; height: 6px;
    background: var(--sage);
    border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .hero h1 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: clamp(3rem, 7vw, 5.5rem);
    color: var(--text-dark);
    line-height: 1.1;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    animation: fadeUp 0.8s ease 0.1s both;
  }
  .hero h1 .accent { color: var(--sage-dark); }

  .hero-sub {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.1rem;
    color: var(--text-mid);
    font-weight: 300;
    letter-spacing: 0.15em;
    margin-bottom: 16px;
    animation: fadeUp 0.8s ease 0.2s both;
  }
  .hero-desc {
    max-width: 520px;
    font-size: 0.95rem;
    color: var(--text-light);
    line-height: 1.9;
    margin-bottom: 60px;
    animation: fadeUp 0.8s ease 0.3s both;
  }

  /* module cards */
  .modules {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 860px;
    width: 100%;
    animation: fadeUp 0.8s ease 0.4s both;
  }
  @media (max-width: 640px) {
    .modules { grid-template-columns: 1fr; }
  }

  .module-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 40px 36px;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    cursor: pointer;
  }
  .module-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .module-card.garden::before {
    background: linear-gradient(135deg, rgba(122,158,126,0.08), rgba(61,92,64,0.05));
  }
  .module-card.treehouse::before {
    background: linear-gradient(135deg, rgba(138,184,200,0.08), rgba(90,107,92,0.05));
  }
  .module-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 56px rgba(61,92,64,0.18);
  }
  .module-card:hover::before { opacity: 1; }

  .card-icon {
    width: 60px; height: 60px;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .garden .card-icon { background: rgba(122,158,126,0.18); }
  .treehouse .card-icon { background: rgba(138,184,200,0.2); }

  .card-label {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    font-weight: 500;
    text-transform: uppercase;
  }
  .garden .card-label { color: var(--sage); }
  .treehouse .card-label { color: var(--sky); }

  .card-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 1.8rem;
    color: var(--text-dark);
    letter-spacing: 0.06em;
    line-height: 1.2;
  }
  .card-desc {
    font-size: 0.88rem;
    color: var(--text-mid);
    line-height: 1.8;
    flex: 1;
  }

  .card-cta {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    text-decoration: none;
    margin-top: 8px;
  }
  .garden .card-cta {
    background: var(--sage);
    color: white;
  }
  .garden .card-cta:hover { background: var(--sage-dark); }
  .treehouse .card-cta {
    background: var(--sky);
    color: white;
  }
  .treehouse .card-cta:hover { background: #6a9ab0; }

  .card-decoration {
    position: absolute;
    bottom: -20px; right: -20px;
    font-size: 100px;
    opacity: 0.06;
    pointer-events: none;
    line-height: 1;
  }

  /* stats strip */
  .stats {
    display: flex; gap: 48px;
    margin-top: 56px;
    animation: fadeUp 0.8s ease 0.5s both;
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Noto Serif SC', serif;
    font-size: 2rem;
    font-weight: 600;
    color: var(--moss);
    display: block;
  }
  .stat-label {
    font-size: 0.8rem;
    color: var(--text-light);
    letter-spacing: 0.06em;
    margin-top: 4px;
  }
  .stat-divider {
    width: 1px;
    background: rgba(122,158,126,0.25);
    align-self: stretch;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* scroll hint */
  .scroll-hint {
    position: absolute; bottom: 32px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 0.78rem; color: var(--text-light);
    letter-spacing: 0.08em;
    animation: fadeUp 1s ease 1s both;
  }
  .scroll-hint .chevron {
    width: 20px; height: 20px;
    border-right: 1.5px solid var(--text-light);
    border-bottom: 1.5px solid var(--text-light);
    transform: rotate(45deg);
    animation: bounce 1.8s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50% { transform: rotate(45deg) translateY(5px); }
  }
</style>
</head>
<body>
