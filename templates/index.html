<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理咨询 · 树洞智能体 · 心晴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root {
  --sage:         #7a9e7e;
  --sage-light:   #b8d4bb;
  --sage-dark:    #4a6b4e;
  --moss:         #3d5c40;
  --cream:        #f8f4ee;
  --warm-white:   #fdfaf6;
  --sky:          #8ab8c8;
  --terracotta:   #c17f5a;
  --gold:         #c9a96e;
  --text-dark:    #2c3e2d;
  --text-mid:     #5a6b5c;
  --text-light:   #8a9b8c;
  --glass:        rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.82);
  --shadow:       0 6px 32px rgba(61,92,64,0.10);
  --radius:       22px;
  --accent:       #e07a5f;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  background-color: #e8f0e4;
  background-image:
    radial-gradient(ellipse at 5%  10%, rgba(122,158,126,0.30) 0%, transparent 45%),
    radial-gradient(ellipse at 95% 90%, rgba(138,184,200,0.18) 0%, transparent 45%);
  color: var(--text-dark);
  display: flex; flex-direction: column;
}

/* ── NAV ── */
nav {
  position: sticky; top:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding: 13px 36px;
  background: rgba(248,244,238,0.82);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(122,158,126,0.18);
  gap: 16px;
}
.nav-logo {
  font-family:'ZCOOL XiaoWei',serif;
  font-size:1.3rem; color:var(--moss);
  text-decoration:none;
  display:flex; align-items:center; gap:8px;
  flex-shrink:0;
}
.nav-logo svg { width:24px; height:24px; }

.nav-avatar-info {
  display:flex; align-items:center; gap:10px;
  background: rgba(255,255,255,0.65);
  border: 1px solid rgba(122,158,126,0.22);
  border-radius:50px; padding:6px 14px 6px 8px;
}
.nav-avatar-info img {
  width:28px; height:28px; border-radius:50%;
  object-fit:cover; border:2px solid rgba(122,158,126,0.3);
}
.nav-avatar-info span {
  font-size:0.82rem; color:var(--text-mid); font-weight:500;
}

.nav-links { display:flex; align-items:center; gap:22px; }
.nav-link {
  text-decoration:none; font-size:0.85rem;
  color:var(--text-mid); transition:color 0.2s;
}
.nav-link:hover { color:var(--moss); }

.status-badge {
  display:flex; align-items:center; gap:7px;
  font-size:0.8rem; color:var(--text-mid);
  background: rgba(255,255,255,0.65);
  border:1px solid rgba(122,158,126,0.2);
  border-radius:50px; padding:5px 12px;
}
.status-dot {
  width:8px; height:8px; border-radius:50%;
  background:#52b788;
  animation: pulse-green 2s infinite;
}
@keyframes pulse-green {
  0%  { box-shadow:0 0 0 0 rgba(82,183,136,0.5); }
  70% { box-shadow:0 0 0 7px rgba(82,183,136,0); }
  100%{ box-shadow:0 0 0 0 rgba(82,183,136,0); }
}
#status-text { font-size:0.78rem; }

/* ── LAYOUT ── */
.page-body {
  flex:1;
  display:grid;
  grid-template-columns: 1fr 330px;
  gap:20px;
  padding:20px 28px 24px;
  max-width:1280px;
  margin:0 auto;
  width:100%;
}
@media (max-width:960px) {
  .page-body { grid-template-columns:1fr; }
}

/* ── PANEL BASE ── */
.panel {
  background: var(--glass);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow:hidden;
}
.panel-header {
  padding:14px 20px;
  border-bottom:1px solid rgba(122,158,126,0.12);
  display:flex; align-items:center; justify-content:space-between;
}
.panel-title {
  font-family:'Noto Serif SC',serif;
  font-size:0.88rem; font-weight:600;
  color:var(--text-dark);
  display:flex; align-items:center; gap:7px;
}
.panel-title .dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--sage);
}

/* ── LEFT COL: AVATAR + CHAT ── */
.left-col { display:flex; flex-direction:column; gap:18px; }

/* Scene */
.scene-wrap {
  position:relative; border-radius:var(--radius);
  overflow:hidden; flex-shrink:0;
  background: linear-gradient(160deg, #d4e8d6 0%, #c2dfc8 50%, #b8d4c0 100%);
  box-shadow: var(--shadow);
  height:360px;
  display:flex; align-items:center; justify-content:center;
}
.scene-wrap::before {
  /* subtle ground shadow */
  content:''; position:absolute;
  bottom:0; left:0; right:0; height:60px;
  background: linear-gradient(to top, rgba(61,92,64,0.06), transparent);
  z-index:1; pointer-events:none;
}
#avatar-img, #idle-video, #avatar-video {
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:contain;
  border-radius:var(--radius);
}
#avatar-img { display:block; }
#idle-video, #avatar-video { display:none; }

.video-loading {
  display:none; position:absolute; inset:0;
  background:rgba(232,240,228,0.6);
  align-items:center; justify-content:center;
  flex-direction:column; gap:10px;
  border-radius:var(--radius); z-index:5;
}
.video-loading.show { display:flex; }
.spinner-leaf {
  width:36px; height:36px;
  border:3px solid rgba(122,158,126,0.2);
  border-top-color: var(--sage);
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.video-loading p { font-size:0.82rem; color:var(--text-mid); }

/* Avatar name overlay */
.avatar-name-tag {
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  z-index:10;
  background:rgba(253,250,246,0.88);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:50px; padding:5px 16px;
  font-size:0.78rem; color:var(--text-mid);
  white-space:nowrap;
}
.avatar-name-tag strong { color:var(--moss); font-weight:500; }

/* Camera toggle */
.scene-controls {
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.ctrl-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:50px;
  border:1.5px solid rgba(122,158,126,0.3);
  background:rgba(255,255,255,0.75);
  font-size:0.82rem; color:var(--text-mid);
  cursor:pointer; font-family:'Noto Sans SC',sans-serif;
  transition:all 0.2s;
}
.ctrl-btn:hover {
  background:rgba(122,158,126,0.12);
  border-color:var(--sage); color:var(--sage-dark);
}
.ctrl-btn.active {
  background:var(--sage); color:white;
  border-color:var(--sage);
}

/* camera preview */
#camera-preview {
  display:none; width:100%; max-width:220px;
  border-radius:12px; margin-top:4px;
  border:2px solid rgba(122,158,126,0.3);
}

/* ── CHAT PANEL ── */
.chat-panel { flex:1; display:flex; flex-direction:column; min-height:220px; }
.chat-panel .panel-header { flex-shrink:0; }

.response-area {
  flex:1; padding:18px 20px;
  overflow-y:auto; min-height:140px;
  font-size:0.9rem; line-height:1.85;
  color:var(--text-mid);
  scrollbar-width:thin;
  scrollbar-color:rgba(122,158,126,0.3) transparent;
}
.response-area:empty::before {
  content:'等待你的倾诉…';
  color:var(--text-light); font-style:italic;
}
.response-area p { margin-bottom:8px; }
.response-meta {
  display:inline-flex; align-items:center; gap:6px;
  margin-top:12px; padding:6px 12px;
  background:rgba(122,158,126,0.10);
  border-radius:8px; border-left:3px solid var(--sage-light);
  font-size:0.78rem; color:var(--sage-dark);
}

/* Input row */
.input-row {
  padding:14px 16px;
  border-top:1px solid rgba(122,158,126,0.12);
  display:flex; gap:10px; align-items:center;
  flex-shrink:0;
}
.input-row input[type="text"] {
  flex:1;
  padding:12px 18px;
  border:1.5px solid rgba(122,158,126,0.25);
  border-radius:50px;
  background:rgba(255,255,255,0.85);
  font-size:0.9rem;
  font-family:'Noto Sans SC',sans-serif;
  color:var(--text-dark);
  outline:none;
  transition:all 0.25s;
}
.input-row input:focus {
  border-color:var(--sage);
  background:#fff;
  box-shadow:0 0 0 3px rgba(122,158,126,0.12);
}
.input-row input:disabled { opacity:0.55; }

.send-btn {
  width:42px; height:42px; border-radius:50%;
  border:none; background:var(--sage);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
  transition:all 0.2s;
  box-shadow:0 3px 12px rgba(122,158,126,0.3);
}
.send-btn:hover:not(:disabled) {
  background:var(--moss);
  transform:scale(1.07);
  box-shadow:0 5px 16px rgba(61,92,64,0.35);
}
.send-btn:disabled { background:rgba(122,158,126,0.3); cursor:not-allowed; transform:none; }
.send-btn svg { width:18px; height:18px; }

.voice-btn {
  width:42px; height:42px; border-radius:50%;
  border:1.5px solid rgba(122,158,126,0.3);
  background:rgba(255,255,255,0.8);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
  font-size:18px; transition:all 0.2s;
}
.voice-btn:hover { background:rgba(122,158,126,0.12); border-color:var(--sage); }
.voice-btn.listening {
  background:var(--accent); border-color:var(--accent);
  animation:pulse-red 1.5s infinite;
}
@keyframes pulse-red {
  0%  { box-shadow:0 0 0 0 rgba(224,122,95,0.5); }
  70% { box-shadow:0 0 0 9px rgba(224,122,95,0); }
  100%{ box-shadow:0 0 0 0 rgba(224,122,95,0); }
}
#voice-status { font-size:0.72rem; color:var(--text-light); padding:0 4px; min-width:56px; text-align:center; }

/* ── RIGHT SIDEBAR ── */
.right-col { display:flex; flex-direction:column; gap:18px; }

/* Emotion panel */
.emotion-display {
  display:none;
  flex-direction:column;
}
.emotion-display.visible { display:flex; }

.emotion-result-big {
  font-size:2rem; text-align:center;
  padding: 10px 0 4px;
  font-family:'ZCOOL XiaoWei',serif;
  color:var(--text-dark);
}
.emotion-bars-list { padding:0 20px 16px; display:flex; flex-direction:column; gap:8px; }
.ebar { }
.ebar-top { display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-mid); margin-bottom:3px; }
.ebar-track { height:5px; background:rgba(122,158,126,0.12); border-radius:3px; overflow:hidden; }
.ebar-fill { height:100%; background:var(--sage); border-radius:3px; transition:width 0.6s ease; }

/* Suggestions */
.suggestions-list {
  padding:12px 16px 16px;
  display:flex; flex-direction:column; gap:8px;
}
.suggest-chip {
  padding:9px 14px; border-radius:14px;
  border:1px solid rgba(122,158,126,0.22);
  background:rgba(255,255,255,0.6);
  font-size:0.82rem; color:var(--text-mid);
  cursor:pointer; text-align:left;
  font-family:'Noto Sans SC',sans-serif;
  transition:all 0.2s; line-height:1.5;
}
.suggest-chip:hover {
  background:rgba(122,158,126,0.12);
  border-color:var(--sage); color:var(--sage-dark);
}

/* Tips panel */
.tips-list { padding:12px 18px 16px; display:flex; flex-direction:column; gap:8px; }
.tip-item {
  display:flex; gap:9px; align-items:flex-start;
  font-size:0.8rem; color:var(--text-mid); line-height:1.6;
}
.tip-icon { font-size:14px; flex-shrink:0; margin-top:1px; }

/* Back link */
.back-link {
  display:inline-flex; align-items:center; gap:6px;
  font-size:0.8rem; color:var(--text-light);
  text-decoration:none; padding:8px 14px;
  border-radius:50px;
  border:1px solid rgba(122,158,126,0.2);
  background:rgba(255,255,255,0.5);
  transition:all 0.2s; align-self:flex-start;
}
.back-link:hover { color:var(--sage-dark); border-color:var(--sage); background:rgba(255,255,255,0.8); }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/home">
    <svg viewBox="0 0 28 28" fill="none">
      <circle cx="14" cy="14" r="13" stroke="#3d5c40" stroke-width="1.5"/>
      <path d="M14 22C14 22 8 17 8 12C8 8.5 10.7 7 14 7C17.3 7 20 8.5 20 12C20 17 14 22 14 22Z" fill="#7a9e7e"/>
      <path d="M14 22L14 7" stroke="#3d5c40" stroke-width="1" stroke-dasharray="2 2"/>
    </svg>
    心晴
  </a>

  <!-- shows selected avatar name -->
  <div class="nav-avatar-info" id="nav-avatar-info" style="display:none">

    <span id="nav-avatar-name">助手</span>
  </div>

  <div class="nav-links">

      <div class="status-dot"></div>
      <span id="status-text">系统就绪</span>
    </div>

</nav>

<!-- MAIN -->
<div class="page-body">

  <!-- LEFT: avatar + chat -->
  <div class="left-col">

    <!-- Scene -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>数字人助手</div>
        <div class="scene-controls">
          <button class="ctrl-btn" id="camera-toggle">📷 开启摄像头</button>
          <button class="ctrl-btn voice-btn" id="voice-btn">🎤</button>
          <span id="voice-status">点击语音</span>
        </div>
      </div>
      <div class="scene-wrap" id="scene-container">
        <img id="avatar-img" src="" alt="数字人">
        <video id="idle-video" autoplay loop muted playsinline></video>
        <video id="avatar-video" playsinline></video>
        <div class="video-loading" id="video-loading">
          <div class="spinner-leaf"></div>
          <p>正在思考…</p>
        </div>
        <div class="avatar-name-tag" id="avatar-name-tag">
          正在加载<strong id="avatar-name-display"></strong>
        </div>
      </div>
      <!-- camera preview below scene -->
      <div style="padding:0 16px 14px;display:none" id="camera-wrap">
        <video id="camera-preview" autoplay muted playsinline style="display:block;width:100%;max-width:200px;border-radius:10px;border:2px solid rgba(122,158,126,0.25);"></video>
      </div>
    </div>

    <!-- Chat -->
    <div class="panel chat-panel">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>倾诉对话</div>
      </div>
      <div class="response-area" id="response-content"></div>
      <div class="input-row">
        <input type="text" id="user-input" placeholder="说说你的心里话…" autocomplete="off">
        <button class="voice-btn" id="voice-btn-2" style="display:none">🎤</button>
        <button class="send-btn" id="submit-btn" title="发送">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M2 9h14M10 3l6 6-6 6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

  </div><!-- /left-col -->

  <!-- RIGHT SIDEBAR -->
  <div class="right-col">

    <!-- Emotion panel -->
    <div class="panel emotion-display" id="emotion-panel">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>实时情绪识别</div>
      </div>
      <div class="emotion-result-big" id="emotion-result">😐 平静</div>
      <div class="emotion-bars-list" id="emotion-bars"></div>
    </div>

    <!-- Suggestions -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>话题建议</div>
      </div>
      <div class="suggestions-list">
        <button class="suggest-chip" onclick="usePrompt(this)">我最近感到很焦虑，不知道该怎么办…</button>
        <button class="suggest-chip" onclick="usePrompt(this)">和室友/同学相处遇到了一些困难</button>
        <button class="suggest-chip" onclick="usePrompt(this)">学业压力很大，感觉撑不住了</button>
        <button class="suggest-chip" onclick="usePrompt(this)">情绪低落，对什么都提不起劲</button>
        <button class="suggest-chip" onclick="usePrompt(this)">我想聊聊最近发生的一件事</button>
      </div>

    <!-- Tips -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>使用小贴士</div>
      </div>

        <div class="tip-item"><span class="tip-icon">🌿</span>尽量用自然的语言描述你的感受，越真实越好</div>
        <div class="tip-item"><span class="tip-icon">📷</span>开启摄像头可以让助手感知你的实时情绪</div>
        <div class="tip-item"><span class="tip-icon">🎤</span>支持语音输入，按下麦克风按钮即可说话</div>
        <div class="tip-item"><span class="tip-icon">🔒</span>你的对话内容仅在本地处理，请放心倾诉</div>
      </div>
    </div>

    <!-- Back -->
    <a class="back-link" href="/select">
      ← 更换助手
    </a>
    <a class="back-link" href="/garden" style="margin-top:-6px">
      🌿 去心理润园
    </a>

  </div><!-- /right-col -->

</div><!-- /page-body -->

<script type="module">
import { API } from '/static/js/api.js';
import { AvatarController } from '/static/js/modules/avatar.js';
import { CameraManager }    from '/static/js/modules/camera.js';
import { SpeechManager }    from '/static/js/modules/speech.js';

/* ── restore avatar info in nav ── */
const savedName = localStorage.getItem('selectedAvatarName');
const savedUrl  = localStorage.getItem('selectedAvatarUrl');
if (savedName && savedUrl) {
  const info = document.getElementById('nav-avatar-info');
  document.getElementById('nav-avatar-img').src = savedUrl;
  document.getElementById('nav-avatar-name').textContent = savedName;
  info.style.display = 'flex';
  document.getElementById('avatar-name-display').textContent = '「' + savedName + '」';
}

/* ── avatar controller ── */
const avatar = new AvatarController({
  img:       document.getElementById('avatar-img'),
  idle:      document.getElementById('idle-video'),
  talk:      document.getElementById('avatar-video'),
  loading:   document.getElementById('video-loading'),
  container: document.getElementById('scene-container')
});
avatar.init();

/* ── ui refs ── */
const ui = {
  input:       document.getElementById('user-input'),
  sendBtn:     document.getElementById('submit-btn'),
  responseBox: document.getElementById('response-content'),
  statusText:  document.getElementById('status-text'),
  emotionResult: document.getElementById('emotion-result'),
  emotionBars:   document.getElementById('emotion-bars'),
};

/* ── camera ── */
const camera = new CameraManager(
  document.getElementById('camera-preview'),
  (result) => updateEmotionUI(result)
);

document.getElementById('camera-toggle').onclick = async function() {
  if (camera.active) {
    camera.stop();
    this.textContent = '📷 开启摄像头';
    this.classList.remove('active');
    document.getElementById('camera-wrap').style.display = 'none';
    document.getElementById('emotion-panel').classList.remove('visible');
  } else {
    const ok = await camera.start();
    if (ok) {
      this.textContent = '🚫 关闭摄像头';
      this.classList.add('active');
      document.getElementById('camera-wrap').style.display = 'block';
      document.getElementById('emotion-panel').classList.add('visible');
      camera.startAnalysis();
    }
  }
};

/* ── speech ── */
const speech = new SpeechManager(
  document.getElementById('voice-btn'),
  document.getElementById('voice-status'),
  (text) => { ui.input.value = text; setTimeout(handleAnalyze, 900); }
);
document.getElementById('voice-btn').onclick = () => speech.toggle();

/* ── send ── */
ui.sendBtn.onclick = handleAnalyze;
ui.input.addEventListener('keypress', e => { if (e.key === 'Enter') handleAnalyze(); });

async function handleAnalyze() {
  const text = ui.input.value.trim();
  if (!text) return;

  const currentId = localStorage.getItem('selectedAvatar') || '1';
  ui.sendBtn.disabled = true;
  ui.input.disabled   = true;
  ui.statusText.textContent = '正在分析心理状态…';
  avatar.showLoading();

  /* show user bubble */
  appendBubble('user', text);
  ui.input.value = '';

  try {
    const result = await API.analyzePsychology({
      message: text,
      detected_emotion: camera.getCurrentEmotion(),
      avatar_id: currentId,
      generate_video: true
    });

    if (result.success) {
      const srcLabel = result.model_source === 'local_psychology_model' ? '🧠 本地大模型' : '🤖 备用模型';
      appendBubble('assistant', result.response, `${srcLabel} · 情绪: ${result.detected_emotion}`);

      if (result.video_generated && (result.video_urls || result.video_url)) {
        const videoSource = result.video_urls || result.video_url;
        avatar.playTalking(videoSource, result.audio_url);
      } else {
        avatar.showStatic();
      }
    } else {
      appendBubble('error', '分析失败：' + (result.error || '未知错误'));
      avatar.showStatic();
    }
  } catch (e) {
    appendBubble('error', '系统繁忙，请稍后再试。');
    avatar.showStatic();
  } finally {
    ui.sendBtn.disabled = false;
    ui.input.disabled   = false;
    ui.input.focus();
    ui.statusText.textContent = '系统就绪';
  }
}

function appendBubble(role, text, meta = '') {
  const box = ui.responseBox;
  if (role === 'user') {
    box.innerHTML += `
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <div style="max-width:80%;background:var(--sage);color:white;
          padding:10px 15px;border-radius:18px 18px 4px 18px;
          font-size:0.88rem;line-height:1.7;">${text}</div>
      </div>`;
  } else if (role === 'assistant') {
    box.innerHTML += `
      <div style="display:flex;gap:9px;margin-bottom:14px;align-items:flex-start;">
        <div style="width:30px;height:30px;border-radius:50%;
          background:rgba(122,158,126,0.2);flex-shrink:0;
          display:flex;align-items:center;justify-content:center;font-size:14px;">🌿</div>
        <div style="flex:1;">
          <div style="background:rgba(255,255,255,0.82);border:1px solid rgba(122,158,126,0.18);
            padding:12px 16px;border-radius:4px 18px 18px 18px;
            font-size:0.88rem;line-height:1.8;color:var(--text-mid);">${text}</div>
          ${meta ? `<div class="response-meta" style="margin-top:8px;">${meta}</div>` : ''}
        </div>
      </div>`;
  } else {
    box.innerHTML += `<p style="color:var(--accent);font-size:0.85rem;margin-bottom:8px;">⚠ ${text}</p>`;
  }
  box.scrollTop = box.scrollHeight;
}

/* ── emotion UI ── */
const EMAP = {
  angry:'😠 生气', disgust:'🤢 厌恶', fear:'😨 恐惧',
  happy:'😊 开心', sad:'😢 悲伤', surprise:'😲 惊讶', neutral:'😐 平静'
};
function updateEmotionUI(data) {
  ui.emotionResult.textContent = EMAP[data.dominant_emotion] || data.dominant_emotion;
  const sorted = Object.entries(data.emotion_scores).sort((a,b)=>b[1]-a[1]).slice(0,3);
  ui.emotionBars.innerHTML = sorted.map(([k,v]) => `
    <div class="ebar">
      <div class="ebar-top"><span>${EMAP[k]||k}</span><span>${Math.round(v)}%</span></div>
      <div class="ebar-track"><div class="ebar-fill" style="width:${v}%"></div></div>
    </div>`).join('');
}

/* ── suggestions ── */
window.usePrompt = (el) => {
  ui.input.value = el.textContent;
  ui.input.focus();
};
</script>
</body>
</html>
