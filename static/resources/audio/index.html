<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冥想音频 · 心晴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a9e7e;
    --sage-light: #b8d4bb;
    --sage-dark: #4a6b4e;
    --cream: #f8f4ee;
    --warm-white: #fdfaf6;
    --moss: #3d5c40;
    --terracotta: #c17f5a;
    --sky: #8ab8c8;
    --gold: #c9a96e;
    --lavender: #9b8fc8;
    --rose: #c88fa0;
    --text-dark: #2c3e2d;
    --text-mid: #5a6b5c;
    --text-light: #8a9b8c;
    --glass: rgba(255,255,255,0.7);
    --glass-border: rgba(255,255,255,0.85);
    --shadow: 0 6px 32px rgba(61,92,64,0.1);
    --radius: 22px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    background-color: #e8f0e4;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(122,158,126,0.3) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(138,184,200,0.2) 0%, transparent 45%);
    color: var(--text-dark);
  }

  nav {
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 48px;
    background: rgba(248,244,238,0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(122,158,126,0.2);
  }
  .nav-logo {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 1.4rem; color: var(--moss);
    display: flex; align-items: center; gap: 8px;
    text-decoration: none;
  }
  .nav-right { display: flex; align-items: center; gap: 24px; }
  .nav-link {
    text-decoration: none; font-size: 0.88rem;
    color: var(--text-mid); transition: color 0.2s;
  }
  .nav-link:hover { color: var(--moss); }
  .nav-cta {
    background: var(--sage); color: white;
    border: none; border-radius: 50px;
    padding: 9px 20px; font-size: 0.85rem;
    cursor: pointer; text-decoration: none;
    font-family: 'Noto Sans SC', sans-serif;
    transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--sage-dark); }

  .container {
    max-width: 800px; margin: 0 auto;
    padding: 40px 48px 80px;
  }
  @media (max-width: 768px) {
    nav, .container { padding-left: 20px; padding-right: 20px; }
  }

  .header {
    text-align: center; margin-bottom: 60px;
  }
  .header h1 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    color: var(--text-dark); letter-spacing: 0.06em;
    margin-bottom: 16px;
  }
  .header p {
    font-size: 1rem; color: var(--text-mid);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300; line-height: 1.8;
    max-width: 600px; margin: 0 auto;
  }

  .audio-list {
    display: flex; flex-direction: column; gap: 16px;
  }
  .audio-card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .audio-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 48px rgba(61,92,64,0.16);
  }
  .audio-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .audio-info {
    flex: 1;
  }
  .audio-info h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.05rem; font-weight: 600;
    color: var(--text-dark); margin-bottom: 4px;
  }
  .audio-info p {
    font-size: 0.85rem; color: var(--text-light);
  }
  .audio-duration {
    font-size: 0.8rem; color: var(--text-light);
  }
  .audio-player {
    margin-top: 12px;
    width: 100%;
  }
  .audio-player audio {
    width: 100%;
    border-radius: 8px;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.9rem; font-weight: 500;
    color: var(--sage-dark); text-decoration: none;
    margin-top: 40px;
    transition: gap 0.2s;
  }
  .back-link:hover { gap: 10px; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/home">
    <svg width="24" height="24" viewBox="0 0 28 28" fill="none">

      <path d="M14 22 C14 22 8 17 8 12 C8 8.5 10.7 7 14 7 C17.3 7 20 8.5 20 12 C20 17 14 22 14 22Z" fill="#7a9e7e"/>
    </svg>
    心晴

  <div class="nav-right">

    </div>
  </div>

  <a class="back-link" href="/garden">← 返回心理润园</a>
</div>

</body>
</html>
